name: Desktop app

on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths:
      - 'app/**'
      - 'skills/**'
      - 'agents/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'skills/**'
      - 'agents/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: End-to-end test
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: End-to-end test (Linux)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 blocks the user namespaces Electron's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum npm run test:e2e

  build:
    name: Build (${{ matrix.name }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-26
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#desktop-v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in app/package.json."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      - name: Build for macOS
        if: runner.os == 'macOS'
        env:
          REQUIRE_APPLE_INTELLIGENCE: '1'
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npm run dist:mac
          else
            echo "::warning::No Apple signing certificate is configured, so the macOS build is ad-hoc signed and not notarized."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npm run dist:mac -- -c.mac.identity=-
          fi

      - name: Build for Windows
        if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            echo "::warning::No Windows signing certificate is configured, so the installer is unsigned."
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          npm run dist:win

      - name: Build for Linux
        if: runner.os == 'Linux'
        run: npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: author-studio-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/dist/*.dmg
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Author Studio desktop ${GITHUB_REF_NAME#desktop-v}" \
            --generate-notes
